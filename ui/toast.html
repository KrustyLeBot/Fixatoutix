<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fixatoutix</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; box-sizing: border-box; height: 100%; background: transparent; overflow: hidden; }
    body { font: 14px/1.35 var(--font); color: var(--text); padding: 8px; display: flex; align-items: flex-end; -webkit-font-smoothing: antialiased; }
    .toast {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
      animation: in .18s ease-out;
    }
    .ico { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .ico svg { width: 18px; height: 18px; }
    .error .ico { background: var(--danger-soft); color: var(--danger); }
    .info .ico { background: var(--hover); color: var(--text); }
    .t { min-width: 0; }
    .t b { display: block; font-weight: 600; }
    .t span { display: block; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="status"></div>
  <script src="toast.js"></script>
</body>
</html>
