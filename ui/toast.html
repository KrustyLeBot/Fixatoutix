<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fixatoutix</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; box-sizing: border-box; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.35 var(--font); color: var(--text); padding: 8px; display: flex; align-items: flex-end; -webkit-font-smoothing: antialiased; }
    .toast {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px;
      background: var(--toast-bg); border: 1px solid var(--stroke-strong); border-radius: 8px; box-shadow: var(--shadow);
      animation: in .18s ease-out;
    }
    :root { --toast-bg: #f9f9f9; }
    @media (prefers-color-scheme: dark) { :root { --toast-bg: #2b2b2b; } }
    .mascot { width: 52px; height: 52px; flex: none; }
    .t { min-width: 0; }
    .t b { display: block; font: 600 14px var(--font-display); }
    .t span { display: block; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast.ok { border-left: 4px solid var(--accent); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--ok); }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  </style>
</head>
<body>
  <div class="toast" id="toast" role="status"></div>
  <script src="mascot.js"></script>
  <script src="toast.js"></script>
</body>
</html>
